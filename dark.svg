<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Decorative terminal data-lab banner</title>
<desc id="desc">Coral terminal-inspired abstract data visualization.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181a1f"/><stop offset="1" stop-color="#241b1a"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c95b3f"/><stop offset=".55" stop-color="#e07a58"/><stop offset="1" stop-color="#8f3d2b"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#c95b3f" stroke-opacity=".08"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<rect width="1200" height="300" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#c95b3f" stroke-opacity=".32"/>
