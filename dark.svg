<path d="M0 236 C120 211 180 261 300 227 S500 191 620 231 S820 266 930 219 S1080 206 1200 179" fill="none" stroke="#e07a58" stroke-width="1" opacity=".55" filter="url(#glow)"/>
<g fill="none" stroke="#c95b3f" stroke-opacity=".55">
  <path d="M72 68h130M72 84h88M72 100h112"/>
  <path d="M1010 62h118M1040 78h88M1022 94h106"/>
</g>
<g fill="#c95b3f" opacity=".75">
