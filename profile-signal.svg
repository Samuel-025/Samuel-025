<svg width="1200" height="190" viewBox="0 0 1200 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Decorative data signal</title>
<desc id="desc">Abstract coral data signal with connected nodes.</desc>
<defs>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8f3d2b"/><stop offset=".5" stop-color="#c95b3f"/><stop offset="1" stop-color="#e07a58"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c95b3f" stroke-opacity=".07"/></pattern>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="190" rx="16" fill="#181a1f"/><rect width="1200" height="190" rx="16" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="188" rx="15" fill="none" stroke="#c95b3f" stroke-opacity=".25"/>
<path d="M80 95 H1120" stroke="url(#line)" stroke-width="2" opacity=".7"/>
<path d="M80 95 C180 35 260 150 390 95 S610 40 720 95 S930 155 1120 95" fill="none" stroke="#c95b3f" stroke-opacity=".25"/>
<g fill="#181a1f" stroke="#c95b3f" stroke-width="2" filter="url(#glow)">
 <circle cx="140" cy="95" r="15"/><circle cx="400" cy="95" r="15"/><circle cx="680" cy="95" r="15"/><circle cx="960" cy="95" r="15"/>
</g>
<g fill="#e07a58"><circle cx="140" cy="95" r="3"/><circle cx="400" cy="95" r="3"/><circle cx="680" cy="95" r="3"/><circle cx="960" cy="95" r="3"/></g>
</svg>